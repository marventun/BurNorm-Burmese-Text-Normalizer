[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "burnorm"
version = "0.1.0"
description = "BurNorm — Burmese encoding convert + Unicode normalize (BurVision research family)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Htoo Myat Tun" }]
keywords = [
  "burnorm",
  "burvision",
  "myanmar",
  "burmese",
  "unicode",
  "normalize",
  "zawgyi",
  "wininnwa",
  "pdf",
  "font",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
detect = ["myanmartools>=1.2.0"]
dev = ["pytest>=7.0", "myanmartools>=1.2.0"]

[project.scripts]
burnorm = "burnorm.cli:main"

[project.urls]
Homepage = "https://github.com/EXAMPLE/burnorm"
Issues = "https://github.com/EXAMPLE/burnorm/issues"

[tool.setuptools.packages.find]
include = ["burnorm*"]

[tool.setuptools.package-data]
burnorm = [
  "legacy_maps/burg_fonts.json",
  "wininnwa/data/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
